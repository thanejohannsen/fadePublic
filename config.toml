# Share of *tickets* -- a headcount, not money -- that makes a side "the public"
# and puts the other side on the board. Moneylines are deliberately not listed:
# they reach any threshold almost automatically, because everyone takes the big
# favourite for a small payout.
#
# The board is a log, not advice. See the README for what the record does and
# does not establish.
season = 2026

[fades]
markets = ["spread", "total"]

# The share of *tickets* that makes a side "the public", per market. The two
# stopped sharing a cut once they were measured apart over NFL weeks 1-6:
#
#   spreads  >=80%        19-5       and the 70-79% band beneath it   12-3-2
#   totals   >=80%        12-3       and nothing below 80% worth having
#
# So spreads fire at 70 and totals hold at 80. Both arms ran at 79% either way;
# the lower spread cut buys volume rather than accuracy, which is what makes the
# forward record settle sooner.
#
# Worth saying plainly: this cut was chosen after seeing what it would have
# returned, which is the same move that produced the original 16-4. The 12-3-2
# band is fifteen decisions and well inside what noise produces, and the college
# board found nothing at all at 72% over 350 bets. Lowering it is a bet that the
# NFL spread arm is real, not a demonstration that it is.
[fades.threshold]
spread = 70
total = 80

# A second, lower band: shown on the page under "Watching", never graded and never
# in the record. A cut is a cliff -- a game at 79% is not meaningfully different
# evidence from one at 81% -- but moving a cut changes what the record measures,
# so near misses are displayed instead of counted.
#
# Totals only. Spreads now fire at 70 and have nothing left beneath them worth a
# section; naming `spread` here would describe a band that can never have rows.
# Each entry must sit below that market's threshold -- the band is the gap.
[fades.watch_threshold]
total = 70

# A bet is decided by the last reading at or before kickoff. Inside this many hours
# of kickoff it is *confirmed*; outside, it is still graded but the page prints how
# far out the deciding reading was. Fractional hours are allowed.
lock_lead_hours = 2
# Past this, a reading predates gameday and the bet is dropped rather than graded on
# a guess. Must be at least `lock_lead_hours`. Generous next to it on purpose: the
# scheduler misses its window often enough that a tight cap here would make the
# record's size mostly a fact about GitHub. Note this bounds *grading* only -- the
# archive in records/ keeps every reading it saw, whatever its age.
max_staleness_hours = 12

[paths]
db = "data/fadepublic.db"
site = "docs"
# Tracked, unlike the database. A pre-kickoff ticket count cannot be refetched
# once the game is over, so the settled history lives here.
fade_log = "records/fade_log.json"
